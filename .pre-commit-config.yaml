repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0
    hooks:
      - id: check-yaml
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v2.7.1
    hooks:
      - id: prettier
        exclude: ^charts/flagsmith/values\.(schema\.json|yaml)$
  - repo: https://github.com/losisin/helm-values-schema-json
    rev: v2.6.0
    hooks:
      - id: helm-schema
        args: ['--values', 'charts/flagsmith/values.yaml', '--output', 'charts/flagsmith/values.schema.json']
