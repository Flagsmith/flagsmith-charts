{{- if include "flagsmith.secretInit.enabled" . -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "flagsmith.secretInit.name" . }}
  namespace: {{ include "flagsmith.namespace" . | quote }}
  labels:
    {{- include "flagsmith.labels" . | nindent 4 }}
    app.kubernetes.io/component: django-secret-init
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  ttlSecondsAfterFinished: 60
  template:
    metadata:
      name: {{ include "flagsmith.secretInit.name" . }}
      labels:
        {{- include "flagsmith.labels" . | nindent 8 }}
        app.kubernetes.io/component: django-secret-init
    spec:
      restartPolicy: OnFailure
      serviceAccountName: {{ include "flagsmith.secretInit.name" . }}
      containers:
        - name: secret-creator
          image: bitnamisecure/kubectl:latest
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - |
              NAMESPACE={{ include "flagsmith.namespace" . }}
              # Creates the secret with a random 64-character hex value, unless it already exists.
              ensure_secret() {
                echo "Checking for secret $1 in namespace $NAMESPACE"
                if kubectl get secret "$1" -n "$NAMESPACE" -o name; then
                  echo "Secret $1 already exists. No action taken."
                  return
                fi
                echo "Secret $1 not found. Creating..."
                kubectl create secret generic "$1" -n "$NAMESPACE" \
                  --from-literal="$2=$(openssl rand -hex 32)" \
                  --dry-run=client -o yaml | kubectl apply -f -
                echo "Secret $1 created."
              }
              {{- if not .Values.api.secretKeyFromExistingSecret.enabled }}
              ensure_secret {{ include "flagsmith.api.secretKeySecretName" . }} django-secret-key
              {{- end }}
              {{- if include "flagsmith.experimentation.generateWarehouseCredentialsSecret" . }}
              ensure_secret {{ include "flagsmith.experimentation.warehouseCredentialsSecretName" . }} warehouse-credentials-secret
              {{- end }}
{{- end }}
