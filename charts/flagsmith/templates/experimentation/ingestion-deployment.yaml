{{- if .Values.experimentation.enabled }}
{{- $ingestion := .Values.experimentation.ingestion }}
{{- $wal := include "flagsmith.experimentation.usesWal" . }}
apiVersion: apps/v1
kind: {{ if $wal }}StatefulSet{{ else }}Deployment{{ end }}
metadata:
  namespace: {{ include "flagsmith.namespace" . }}
  name: {{ include "flagsmith.fullname" . }}-ingestion
  {{- with include "flagsmith.annotations" .Values.common }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
  labels:
    {{- include "flagsmith.labels" . | nindent 4 }}
    app.kubernetes.io/component: ingestion
spec:
  {{- if $wal }}
  serviceName: {{ include "flagsmith.fullname" . }}-ingestion
  persistentVolumeClaimRetentionPolicy:
    whenScaled: Retain
  {{- end }}
  selector:
    matchLabels:
      {{- include "flagsmith.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: ingestion
  template:
    metadata:
      annotations:
        checksum/secrets-experimentation: {{ include (print $.Template.BasePath "/experimentation/secret.yaml") . | sha256sum }}
        {{- with $ingestion.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- with .Values.common.labels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- include "flagsmith.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: ingestion
        {{- with $ingestion.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with $ingestion.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $ingestion.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $ingestion.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $ingestion.image.imagePullSecrets | default .Values.global.image.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext: {{- include "flagsmith.mergedSecurityContext" (dict "component" $ingestion "key" "podSecurityContext") | nindent 8 }}
      {{- if $wal }}
      terminationGracePeriodSeconds: 120
      {{- end }}
      containers:
        - name: ingestion
          image: {{ printf "%s:%s" $ingestion.image.repository (required "experimentation.ingestion.image.tag is required" $ingestion.image.tag) }}
          imagePullPolicy: {{ $ingestion.image.imagePullPolicy | default .Values.global.image.imagePullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: SINK
              value: {{ .Values.experimentation.sink | quote }}
            {{- if include "flagsmith.experimentation.usesKafka" . }}
            {{- include "flagsmith.experimentation.kafkaEnv" (dict "root" . "username" .Values.experimentation.kafka.username "passwordRef" (include "flagsmith.experimentation.kafkaPasswordSecretRef" .)) | nindent 12 }}
            # One topic for every environment: warehouse delivery routes each to its warehouse.
            - name: KAFKA_EXTERNAL_TOPIC
              value: {{ .Values.experimentation.kafka.topic | quote }}
            {{- else }}
            {{- include "flagsmith.experimentation.clickhouseEnv" . | nindent 12 }}
            {{- if $wal }}
            - name: SINK_WAL_DIR
              value: /wal
            {{- end }}
            {{- end }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  {{- include "flagsmith.experimentation.databaseUrlSecretRef" (dict "root" . "existingSecret" $ingestion.databaseUrlFromExistingSecret) | nindent 18 }}
            {{- range $name, $value := $ingestion.extraEnv }}
            - name: {{ $name }}
              value: {{ $value | quote }}
            {{- end }}
            {{- range $name, $ref := $ingestion.extraEnvFromSecret }}
            - name: {{ $name }}
              valueFrom:
                secretKeyRef:
                  name: {{ $ref.secretName }}
                  key: {{ $ref.secretKey }}
            {{- end }}
          {{- include "flagsmith.probe" (dict "name" "livenessProbe" "probe" $ingestion.livenessProbe "port" "http") | nindent 10 }}
          {{- include "flagsmith.probe" (dict "name" "readinessProbe" "probe" $ingestion.readinessProbe "port" "http") | nindent 10 }}
          securityContext: {{- include "flagsmith.mergedSecurityContext" (dict "component" $ingestion "key" "securityContext") | nindent 12 }}
          resources:
            {{- toYaml $ingestion.resources | nindent 12 }}
          {{- if $wal }}
          volumeMounts:
            - name: wal
              mountPath: /wal
          {{- end }}
  {{- if $wal }}
  volumeClaimTemplates:
    - metadata:
        name: wal
      spec:
        accessModes:
          - ReadWriteOnce
        {{- with .Values.experimentation.clickhouse.wal.storageClassName }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.experimentation.clickhouse.wal.size }}
  {{- end }}
{{- end }}
