{{- if and .Values.experimentation.enabled .Values.experimentation.warehouseDelivery.enabled .Values.hpa.warehouseDelivery.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  namespace: {{ include "flagsmith.namespace" . }}
  name: {{ include "flagsmith.fullname" . }}-warehouse-delivery
  labels:
    {{- include "flagsmith.labels" . | nindent 4 }}
    app.kubernetes.io/component: warehouse-delivery
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "flagsmith.fullname" . }}-warehouse-delivery
  minReplicas: {{ .Values.hpa.warehouseDelivery.minReplicas }}
  maxReplicas: {{ .Values.hpa.warehouseDelivery.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.hpa.warehouseDelivery.targetCPUUtilization }}
{{- end }}
