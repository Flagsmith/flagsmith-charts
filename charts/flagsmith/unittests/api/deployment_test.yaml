suite: API deployment
templates:
  - api/deployment.yaml
  - api/secret.yaml # api/deployment.yaml includes it for a checksum
release:
  name: flagsmith
tests:
  - it: reads DATABASE_URL from the chart secret by default
    template: api/deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DATABASE_URL
            valueFrom:
              secretKeyRef:
                name: flagsmith
                key: DATABASE_URL

  - it: reads DATABASE_URL from an existing secret when configured
    set:
      databaseExternal:
        enabled: true
        urlFromExistingSecret:
          enabled: true
          name: my-db
          key: url
    template: api/deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DATABASE_URL
            valueFrom:
              secretKeyRef:
                name: my-db
                key: url
