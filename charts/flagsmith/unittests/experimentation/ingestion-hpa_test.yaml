suite: ingestion HPA
templates:
  - experimentation/ingestion-hpa.yaml
release:
  name: flagsmith
values:
  - ../values/experimentation.yaml
tests:
  - it: renders nothing when experimentation is disabled
    set:
      experimentation.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: renders nothing when the HPA is disabled
    set:
      hpa.ingestion.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: scales the ingestion deployment on CPU
    asserts:
      - equal:
          path: spec.scaleTargetRef.name
          value: flagsmith-ingestion
      - equal:
          path: spec.minReplicas
          value: 1
      - equal:
          path: spec.maxReplicas
          value: 5
      - equal:
          path: spec.metrics[0].resource.target.averageUtilization
          value: 70
