suite: experimentation init configmap
templates:
  - experimentation/init-configmap.yaml
release:
  name: flagsmith
values:
  - ../values/experimentation.yaml
tests:
  - it: ships the init script
    asserts:
      - matchRegex:
          path: data["init.sh"]
          pattern: kafka-topics.sh --bootstrap-server

  - it: leaves ClickHouse alone; warehouse delivery inserts into each environment's warehouse
    asserts:
      - notMatchRegex:
          path: data["init.sh"]
          pattern: clickhouse
