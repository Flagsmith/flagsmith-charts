suite: experimentation init configmap
templates:
  - experimentation/init-configmap.yaml
release:
  name: flagsmith
values:
  - ../values/experimentation.yaml
tests:
  - it: renders nothing when experimentation is disabled
    set:
      experimentation.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: ships the init script
    asserts:
      - equal:
          path: metadata.name
          value: flagsmith-experimentation-init
      - matchRegex:
          path: data["init.sh"]
          pattern: CREATE MATERIALIZED VIEW IF NOT EXISTS events_mv
