suite: secret init job
templates:
  - django-secret-init/job.yaml
release:
  name: flagsmith
tests:
  - it: only generates the Django secret key without experimentation
    asserts:
      - equal:
          path: metadata.name
          value: flagsmith-django-secret-key
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: ensure_secret flagsmith-django-secret-key django-secret-key
      - notMatchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: warehouse-credentials-secret

  - it: also generates the warehouse credentials secret with experimentation
    values:
      - ../values/experimentation.yaml
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: ensure_secret flagsmith-warehouse-credentials-secret warehouse-credentials-secret

  - it: generates only the warehouse credentials secret when the Django key is provided
    values:
      - ../values/experimentation.yaml
    set:
      api.secretKeyFromExistingSecret: {enabled: true, name: django, key: secret-key}
    asserts:
      - equal:
          path: metadata.name
          value: flagsmith-warehouse-credentials-secret
      - notMatchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: django-secret-key

  - it: renders nothing when every secret is provided
    values:
      - ../values/experimentation.yaml
    set:
      api.secretKeyFromExistingSecret: {enabled: true, name: django, key: secret-key}
      experimentation.warehouseCredentialsSecretFromExistingSecret: {enabled: true, name: wcs, key: secret}
    asserts:
      - hasDocuments:
          count: 0
