suite: experimentation API env
templates:
  - deployment-api.yaml
  - secrets-api.yaml # deployment-api.yaml includes it for a checksum
  - experimentation/secret.yaml # and this one
  - deployment-task-processor.yaml
release:
  name: flagsmith
values:
  - ../values/experimentation.yaml
tests:
  - it: turns experimentation on in the API
    template: deployment-api.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: EXPERIMENTATION_ENABLED, value: "true"}
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: WAREHOUSE_CREDENTIALS_SECRET
            valueFrom: {secretKeyRef: {name: flagsmith-warehouse-credentials-secret, key: warehouse-credentials-secret}}

  - it: restarts the API when the experimentation secret changes
    template: deployment-api.yaml
    asserts:
      - exists:
          path: spec.template.metadata.annotations["checksum/secrets-experimentation"]

  - it: leaves the API unchanged when experimentation is disabled
    template: deployment-api.yaml
    set:
      experimentation.enabled: false
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          any: true
          content: {name: EXPERIMENTATION_ENABLED}
      - notExists:
          path: spec.template.metadata.annotations["checksum/secrets-experimentation"]

  - it: gives the task processor the same warehouse credentials secret
    template: deployment-task-processor.yaml
    set:
      taskProcessor.enabled: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: WAREHOUSE_CREDENTIALS_SECRET
            valueFrom: {secretKeyRef: {name: flagsmith-warehouse-credentials-secret, key: warehouse-credentials-secret}}
