suite: experimentation API env
templates:
  - deployment-api.yaml
  - deployment-task-processor.yaml
  - secrets-api.yaml # both deployments include it for a checksum
  - experimentation/secret.yaml # and this one
release:
  name: flagsmith
values:
  - ../values/experimentation.yaml
set:
  taskProcessor.enabled: true
tests:
  - it: gives the API the ClickHouse URL from the chart secret
    template: deployment-api.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: EXPERIMENTATION_CLICKHOUSE_URL
            valueFrom:
              secretKeyRef:
                name: flagsmith-experimentation
                key: CLICKHOUSE_URL

  - it: gives the task processor the ClickHouse URL
    template: deployment-task-processor.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: EXPERIMENTATION_CLICKHOUSE_URL
            valueFrom:
              secretKeyRef:
                name: flagsmith-experimentation
                key: CLICKHOUSE_URL

  - it: uses an existing secret when configured
    template: deployment-api.yaml
    set:
      experimentation.clickhouse.urlFromExistingSecret: {enabled: true, name: ch, key: url}
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: EXPERIMENTATION_CLICKHOUSE_URL
            valueFrom:
              secretKeyRef:
                name: ch
                key: url

  - it: adds nothing when experimentation is disabled
    template: deployment-api.yaml
    set:
      experimentation.enabled: false
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          any: true
          content:
            name: EXPERIMENTATION_CLICKHOUSE_URL

  - it: restarts the API when the experimentation secret changes
    template: deployment-api.yaml
    asserts:
      - exists:
          path: spec.template.metadata.annotations["checksum/secrets-experimentation"]

  - it: restarts the task processor when the experimentation secret changes
    template: deployment-task-processor.yaml
    asserts:
      - exists:
          path: spec.template.metadata.annotations["checksum/secrets-experimentation"]

  - it: adds no checksum when experimentation is disabled
    template: deployment-api.yaml
    set:
      experimentation.enabled: false
    asserts:
      - notExists:
          path: spec.template.metadata.annotations["checksum/secrets-experimentation"]
