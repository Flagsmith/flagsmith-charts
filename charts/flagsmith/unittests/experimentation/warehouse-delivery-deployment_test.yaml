suite: warehouse delivery deployment
templates:
  - experimentation/warehouse-delivery-deployment.yaml
  - experimentation/secret.yaml # included for a checksum
release:
  name: flagsmith
values:
  - ../values/experimentation.yaml
tests:
  - it: reads both topics, the API database and the warehouse credentials secret
    template: experimentation/warehouse-delivery-deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: EXTERNAL_WAREHOUSE_TOPIC, value: flagsmith_warehouse_events}
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: EXTERNAL_WAREHOUSE_RETRY_TOPIC, value: flagsmith_warehouse_events_retry}
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DATABASE_URL
            valueFrom: {secretKeyRef: {name: flagsmith, key: DATABASE_URL}}
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: WAREHOUSE_CREDENTIALS_SECRET
            valueFrom: {secretKeyRef: {name: flagsmith-warehouse-credentials-secret, key: warehouse-credentials-secret}}

  - it: reads the warehouse credentials secret from an existing secret
    template: experimentation/warehouse-delivery-deployment.yaml
    set:
      experimentation.warehouseCredentialsSecretFromExistingSecret: {enabled: true, name: wcs, key: secret}
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: WAREHOUSE_CREDENTIALS_SECRET
            valueFrom: {secretKeyRef: {name: wcs, key: secret}}

  - it: runs as non-root
    template: experimentation/warehouse-delivery-deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.securityContext.runAsNonRoot
          value: true

  - it: restarts the pod when a delivery loop hangs
    template: experimentation/warehouse-delivery-deployment.yaml
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].livenessProbe.exec.command[2]
          pattern: /tmp/heartbeat-events /tmp/heartbeat-retry

  - it: uses its own database user when configured
    template: experimentation/warehouse-delivery-deployment.yaml
    set:
      experimentation.warehouseDelivery.databaseUrlFromExistingSecret: {enabled: true, name: delivery-db, key: url}
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DATABASE_URL
            valueFrom: {secretKeyRef: {name: delivery-db, key: url}}

  - it: defaults the key of an existing warehouse credentials secret
    template: experimentation/warehouse-delivery-deployment.yaml
    set:
      experimentation.warehouseCredentialsSecretFromExistingSecret: {enabled: true, name: wcs}
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: WAREHOUSE_CREDENTIALS_SECRET
            valueFrom: {secretKeyRef: {name: wcs, key: warehouse-credentials-secret}}

  - it: requires a name for an existing warehouse credentials secret
    template: experimentation/warehouse-delivery-deployment.yaml
    set:
      experimentation.warehouseCredentialsSecretFromExistingSecret: {enabled: true}
    asserts:
      - failedTemplate:
          errorMessage: experimentation.warehouseCredentialsSecretFromExistingSecret.name is required
