suite: experimentation secret
templates:
  - experimentation/secret.yaml
release:
  name: flagsmith
values:
  - ../values/experimentation.yaml
tests:
  - it: stores the Kafka password
    asserts:
      - equal:
          path: data.KAFKA_PASSWORD
          value: a2Fma2Etc2VjcmV0

  - it: stores the ClickHouse password with the clickhouse sink
    set:
      experimentation.sink: clickhouse
      experimentation.clickhouse: {url: https://clickhouse.example.com:8443, password: clickhouse-secret}
    asserts:
      - equal:
          path: data.CLICKHOUSE_PASSWORD
          value: Y2xpY2tob3VzZS1zZWNyZXQ=
      - notExists:
          path: data.KAFKA_PASSWORD

  - it: renders nothing when every value comes from an existing secret
    set:
      experimentation.kafka.passwordFromExistingSecret: {enabled: true, name: kafka, key: password}
    asserts:
      - hasDocuments:
          count: 0
