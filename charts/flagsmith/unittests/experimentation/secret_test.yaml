suite: experimentation secret
templates:
  - experimentation/secret.yaml
release:
  name: flagsmith
values:
  - ../values/experimentation.yaml
tests:
  - it: renders nothing when experimentation is disabled
    set:
      experimentation.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: stores the ClickHouse URL and Kafka password
    asserts:
      - equal:
          path: metadata.name
          value: flagsmith-experimentation
      - equal:
          path: data.CLICKHOUSE_URL
          value: Y2xpY2tob3VzZXM6Ly9mbGFnc21pdGg6Y2gtc2VjcmV0QGNsaWNraG91c2UuZXhhbXBsZS5jb206OTQ0MC9mbGFnc21pdGhfZXhw
      - equal:
          path: data.KAFKA_PASSWORD
          value: a2Fma2Etc2VjcmV0

  - it: leaves out the Kafka password without scram
    set:
      experimentation.kafka.auth: none
    asserts:
      - notExists:
          path: data.KAFKA_PASSWORD

  - it: renders nothing when every value comes from an existing secret
    set:
      experimentation.clickhouse.urlFromExistingSecret: {enabled: true, name: ch, key: url}
      experimentation.kafka.passwordFromExistingSecret: {enabled: true, name: kafka, key: password}
    asserts:
      - hasDocuments:
          count: 0
