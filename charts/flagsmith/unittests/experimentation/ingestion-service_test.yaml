suite: ingestion service
templates:
  - experimentation/ingestion-service.yaml
release:
  name: flagsmith
values:
  - ../values/experimentation.yaml
tests:
  - it: renders nothing when experimentation is disabled
    set:
      experimentation.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: exposes port 8080 to the ingestion pods
    asserts:
      - equal:
          path: metadata.name
          value: flagsmith-ingestion
      - equal:
          path: spec.ports[0].port
          value: 8080
      - equal:
          path: spec.selector["app.kubernetes.io/component"]
          value: ingestion
