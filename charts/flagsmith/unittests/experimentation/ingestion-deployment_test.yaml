suite: ingestion deployment
templates:
  - experimentation/ingestion-deployment.yaml
  - experimentation/secret.yaml # included for a checksum
release:
  name: flagsmith
values:
  - ../values/experimentation.yaml
tests:
  - it: leaves the replica count to the HPA
    template: experimentation/ingestion-deployment.yaml
    asserts:
      - notExists:
          path: spec.replicas

  - it: sends every event to the one topic, and reads keys from the API database
    template: experimentation/ingestion-deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: SINK, value: kafka}
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: KAFKA_EXTERNAL_TOPIC, value: flagsmith_warehouse_events}
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DATABASE_URL
            valueFrom: {secretKeyRef: {name: flagsmith, key: DATABASE_URL}}

  - it: runs as non-root
    template: experimentation/ingestion-deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.securityContext.runAsNonRoot
          value: true
      - equal:
          path: spec.template.spec.securityContext.fsGroup
          value: 10001

  - it: reads keys with its own database user when configured
    template: experimentation/ingestion-deployment.yaml
    set:
      experimentation.ingestion.databaseUrlFromExistingSecret: {enabled: true, name: ingestion-db, key: url}
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DATABASE_URL
            valueFrom: {secretKeyRef: {name: ingestion-db, key: url}}

  - it: writes events straight to ClickHouse with the clickhouse sink
    template: experimentation/ingestion-deployment.yaml
    set:
      experimentation.sink: clickhouse
      experimentation.clickhouse: {url: https://clickhouse.example.com:8443, password: clickhouse-secret}
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: SINK, value: clickhouse}
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: CLICKHOUSE_URL, value: https://clickhouse.example.com:8443}
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: CLICKHOUSE_PASSWORD
            valueFrom: {secretKeyRef: {name: flagsmith-experimentation, key: CLICKHOUSE_PASSWORD}}
      - notContains:
          path: spec.template.spec.containers[0].env
          content: {name: KAFKA_BOOTSTRAP_SERVERS, value: kafka-1:9096,kafka-2:9096}

  - it: reads the ClickHouse password from an existing secret
    template: experimentation/ingestion-deployment.yaml
    set:
      experimentation.sink: clickhouse
      experimentation.clickhouse:
        url: https://clickhouse.example.com:8443
        passwordFromExistingSecret: {enabled: true, name: clickhouse, key: password}
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: CLICKHOUSE_PASSWORD
            valueFrom: {secretKeyRef: {name: clickhouse, key: password}}

  - it: buffers ClickHouse events in a write-ahead log on a volume per pod
    template: experimentation/ingestion-deployment.yaml
    set:
      experimentation.sink: clickhouse
      experimentation.clickhouse:
        url: https://clickhouse.example.com:8443
        wal: {enabled: true, size: 20Gi, storageClassName: gp3}
    asserts:
      - isKind:
          of: StatefulSet
      - equal:
          path: spec.persistentVolumeClaimRetentionPolicy.whenScaled
          value: Retain
      - equal:
          path: spec.template.spec.terminationGracePeriodSeconds
          value: 120
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: SINK_WAL_DIR, value: /wal}
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content: {name: wal, mountPath: /wal}
      - equal:
          path: spec.volumeClaimTemplates[0].spec
          value:
            accessModes: [ReadWriteOnce]
            storageClassName: gp3
            resources: {requests: {storage: 20Gi}}
