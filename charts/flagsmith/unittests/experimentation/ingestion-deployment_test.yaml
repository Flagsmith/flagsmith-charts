suite: ingestion deployment
templates:
  - experimentation/ingestion-deployment.yaml
  - experimentation/secret.yaml # included for a checksum
release:
  name: flagsmith
values:
  - ../values/experimentation.yaml
tests:
  - it: renders nothing when experimentation is disabled
    template: experimentation/ingestion-deployment.yaml
    set:
      experimentation.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: leaves the replica count to the HPA
    template: experimentation/ingestion-deployment.yaml
    asserts:
      - equal:
          path: metadata.name
          value: flagsmith-ingestion
      - notExists:
          path: spec.replicas

  - it: restarts when the experimentation secret changes
    template: experimentation/ingestion-deployment.yaml
    asserts:
      - exists:
          path: spec.template.metadata.annotations["checksum/secrets-experimentation"]

  - it: requires an image tag
    template: experimentation/ingestion-deployment.yaml
    set:
      experimentation.ingestion.image.tag: ""
    asserts:
      - failedTemplate:
          errorMessage: experimentation.ingestion.image.tag is required

  - it: wires Kafka, the single topic and the database
    template: experimentation/ingestion-deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: flagsmith/events-ingestion-api:1.0.0
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: KAFKA_BOOTSTRAP_SERVERS, value: "kafka-1:9096,kafka-2:9096"}
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: KAFKA_TOPIC, value: flagsmith_warehouse_events}
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: KAFKA_EXTERNAL_TOPIC, value: flagsmith_warehouse_events}
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: KAFKA_USERNAME, value: ingestion}
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: KAFKA_PASSWORD
            valueFrom: {secretKeyRef: {name: flagsmith-experimentation, key: KAFKA_PASSWORD}}
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DATABASE_URL
            valueFrom: {secretKeyRef: {name: flagsmith, key: DATABASE_URL}}

  - it: leaves out the Kafka login without scram
    template: experimentation/ingestion-deployment.yaml
    set:
      experimentation.kafka.auth: none
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          any: true
          content: {name: KAFKA_PASSWORD}

  - it: uses a dedicated database URL when configured
    template: experimentation/ingestion-deployment.yaml
    set:
      experimentation.ingestion.databaseUrl.fromExistingSecret: {enabled: true, name: ingestion-db, key: url}
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DATABASE_URL
            valueFrom: {secretKeyRef: {name: ingestion-db, key: url}}

  - it: runs as non-root and probes /health
    template: experimentation/ingestion-deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.securityContext.runAsNonRoot
          value: true
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet.path
          value: /health
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.port
          value: http
