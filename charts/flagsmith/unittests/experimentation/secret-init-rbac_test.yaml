suite: secret init RBAC
templates:
  - api/secret-init-rbac.yaml
  - api/secret-init-serviceaccount.yaml
release:
  name: flagsmith
values:
  - ../values/experimentation.yaml
set:
  api.secretKeyFromExistingSecret: {enabled: true, name: django, key: secret-key}
tests:
  - it: names the ServiceAccount after the Job when only the warehouse secret is generated
    template: api/secret-init-serviceaccount.yaml
    asserts:
      - equal:
          path: metadata.name
          value: flagsmith-secret-init

  - it: binds the Role to that ServiceAccount
    template: api/secret-init-rbac.yaml
    documentIndex: 1
    asserts:
      - equal:
          path: roleRef.name
          value: flagsmith-secret-init
      - equal:
          path: subjects[0].name
          value: flagsmith-secret-init
